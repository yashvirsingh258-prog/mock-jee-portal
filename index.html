<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Main Portal</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true },
            options: { processHtmlClass: 'tex2jax_process' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="no-select">

    <div id="login-screen">
        <div class="login-card">
            <h2>JEE Portal</h2>
            
            <div style="margin-bottom: 10px;">
                <input type="text" id="login-email" placeholder="Student Email">
                <input type="password" id="login-pass" placeholder="Password">
            </div>
            
            <div style="text-align: left; margin-bottom: 25px;">
                <label class="field-label">Select Subject</label>
                <select id="subject-select" onchange="updateTestNames()">
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                </select>

                <label class="field-label">Choose Test</label>
                <select id="test-name-select"></select>
            </div>

            <button class="btn-pri" style="width:100%;" onclick="handleLogin()">
                Login & Start Examination
            </button>
            
            <div style="margin-top: 20px; font-size: 0.85rem; color: #64748b;">
                Don't have an account? 
                <span style="color: #0b4a8f; cursor: pointer; font-weight: 700;" onclick="handleSignup()">Create One</span>
            </div>
        </div>
    </div>

    <div class="header" id="exam-header" style="display: none;">
        <div>JEE MAIN | <span id="display-subject"></span></div>
        <div id="timer-box">TIME: <span id="time">40:00</span></div>
    </div>

    <div class="main-layout" id="quiz-container" style="display: none;">
        <div class="container">
            <div id="question-area" class="tex2jax_process"></div>
            
            <div class="nav-bar">
                <button class="btn-sec" onclick="prevQuestion()">Previous</button>
                <button class="btn-rev" onclick="markForReview()">Mark for Review</button>
                <button class="btn-clear" onclick="clearResponse()">Clear Response</button>
                <button class="btn-pri" id="next-btn" onclick="saveAndNext()">Save & Next</button>
            </div>
            
            <button class="btn-danger" onclick="confirmSubmit()">SUBMIT EXAMINATION</button>
        </div>
        
        <div class="palette">
            <div class="summary-box">
                <div class="stat">Answered: <span id="count-ans">0</span></div>
                <div class="stat">Not Answered: <span id="count-not-ans">0</span></div>
            </div>

            <h4>Question Palette</h4>
            <div id="palette-grid"></div>
            
            <div class="legend-section">
                <div class="leg-row">
                    <div class="leg-item"><span class="dot-leg"></span> Not Visited</div>
                    <div class="leg-item"><span class="dot-leg" style="background: #198754;"></span> Answered</div>
                </div>
                <div class="leg-row">
                    <div class="leg-item"><span class="dot-leg" style="background: white; border: 1px solid #cbd5e1;"></span> Not Answered</div>
                    <div class="leg-item"><span class="dot-leg" style="background: #6f42c1;"></span> Review</div>
                </div>
            </div>
        </div>
    </div>

    <div id="result-screen" style="display: none; padding: 20px;">
        <div class="result-card tex2jax_process">
            <h1 style="text-align: center; color: #0b4a8f;">Test Summary</h1>
            <div id="score-val"></div>
            <div id="review-panel"></div>
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">
            <div style="text-align: center;">
                <button class="btn-pri" onclick="location.reload()">Back to Dashboard</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
